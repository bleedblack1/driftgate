[project]
name = "driftgate"
version = "0.1.0"
description = "Security regression gate for LLM agents. Catches it when a model, prompt, or tool change makes your agent easier to attack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "driftgate contributors" }]
keywords = [
    "llm", "security", "prompt-injection", "agent", "red-team",
    "ai-safety", "regression-testing", "evaluation", "guardrails", "llmops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Providers that are not OpenAI-shaped: Bedrock, Vertex, Azure, and others.
litellm = ["litellm>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/bleedblack1/driftgate"
Repository = "https://github.com/bleedblack1/driftgate"
Issues = "https://github.com/bleedblack1/driftgate/issues"

[project.scripts]
driftgate = "driftgate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftgate"]

[tool.hatch.build.targets.sdist]
# Ship the tests: a security tool should be verifiable by whoever installs it.
include = ["src/driftgate", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[project]
name = "driftguard"
version = "0.0.1"
description = "Detect security regressions in LLM agents when the model, prompt, or tools change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
claude = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
driftguard = "driftguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Security regression gate. Fails the PR if the agent got easier to attack.
name: driftgate

on:
  pull_request:
    # The three things that change the attack surface. Adjust to your layout.
    paths:
      - "src/**"
      - "prompts/**"
      - ".driftgate-baseline.json"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install driftgate

      # Repeated checks on the same PR replay from disk instead of re-billing.
      - uses: actions/cache@v4
        with:
          path: .driftgate-cache
          key: driftgate-${{ hashFiles('.driftgate-baseline.json', 'driftgate.yaml') }}
          restore-keys: driftgate-

      - name: Check for security regressions
        env:
          # whichever provider your driftgate.yaml uses
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: driftgate check --markdown driftgate-report.md

      # Post the table even when the gate fails, so reviewers see why.
      - if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: driftgate-report.md
